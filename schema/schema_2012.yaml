# Year-specific schema: 2022
# Maps logical chart names to their data files and declares available filters.

year: 2012
data_status: Synthetic
source_file: null


# Maps each logical dataset to its tidy CSV file
data_files:
  geo_regions:         "assets/data/geo_regions.csv"
  volunteering_trends: "assets/data/volunteering_trends.csv"
  formal_areas:        "assets/data/formal_areas.csv"
  informal_areas:      "assets/data/informal_areas.csv"
  motivations:         "assets/data/motivations.csv"
  barriers:            "assets/data/barriers.csv"
  time_distribution:   "assets/data/time_distribution.csv"
  gender_comparison:   "assets/data/gender_comparison.csv"

# Declares which filter options are valid for each chart in this year
available_filters:
  activity_bar:
    vol_types: [formal, informal]
    demographics: [Gender, Age, Education, Freq_of_volunteering]

  error_bar:
    vol_types: [Total, Formal, Informal]
    demographics: [Total, Gender, Age, Education, MigrationBackground,
                   Employment, MunicipalitySize, Region, TaskType]

  gender_comparison:
    vol_types: [Formal, Informal]
    dimensions:
      Formal:   [Formal_NumberOfOrgs, Formal_TaskTypes, Formal_Areas, Formal_Time/week]
      Informal: [Informal_Areas, Informal_Time/week]

  motivations_barriers:
    types: [motivation, barrier]
    genders: [all, men, women]

  choropleth:
    vol_types: [perc_volunteers_from_pop, perc_formal_from_pop, perc_informal_from_pop]
    stat_types: [perc, avg_hours, median_hours]
